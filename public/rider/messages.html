<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Chats - KHADOK Rider</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="/css/order-chat.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-page="messages">
    <div class="container">
        <div class="navigation">
            <ul>
                <li><a href="index.html"><span class="icon"><ion-icon name="beer-outline"></ion-icon></span><span class="title">K H A D O K</span></a></li>
                <li><a href="index.html" data-nav="dashboard"><span class="icon"><ion-icon name="home-outline"></ion-icon></span><span class="title">Dashboard</span></a></li>
                <li><a href="messages.html" data-nav="messages" class="active"><span class="icon"><ion-icon name="chatbubble-outline"></ion-icon></span><span class="title">Messages</span></a></li>
                <li><a href="settings.html" data-nav="settings"><span class="icon"><ion-icon name="settings-outline"></ion-icon></span><span class="title">Settings</span></a></li>
                <li><a href="#" id="signOutBtn"><span class="icon"><ion-icon name="log-out-outline"></ion-icon></span><span class="title">Sign Out</span></a></li>
            </ul>
        </div>

        <div class="main">
            <div class="topbar">
                <div class="toggle"><ion-icon name="menu-outline"></ion-icon></div>
                <div class="rider-topbar-meta"><strong>Delivery Chats</strong><span>Active order conversations</span></div>
                <div class="user" id="riderAvatar"></div>
            </div>

            <div class="details">
                <div class="recentOrders" style="width:100%;">
                    <div class="cardHeader"><h2>Active Chats</h2></div>
                    <div id="chat-thread-list" style="padding:20px;">Loading chats...</div>
                </div>

                <div class="recentOrders" style="width:100%; margin-top:20px;">
                    <div class="cardHeader"><h2 id="selected-chat-title">Select a delivery</h2></div>
                    <div id="chat-panel" style="padding:20px;">
                        <p style="color:#64748b;">Choose an active delivery to message the customer.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/order-chat.js"></script>
    <script src="assets/js/rider-shared.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/messages.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>
</html>
