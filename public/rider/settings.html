<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rider Settings - KHADOK</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-page="settings">
    <div class="container">
        <div class="navigation">
            <ul>
                <li><a href="index.html"><span class="icon"><ion-icon name="beer-outline"></ion-icon></span><span class="title">K H A D O K</span></a></li>
                <li><a href="index.html" data-nav="dashboard"><span class="icon"><ion-icon name="home-outline"></ion-icon></span><span class="title">Dashboard</span></a></li>
                <li><a href="messages.html" data-nav="messages"><span class="icon"><ion-icon name="chatbubble-outline"></ion-icon></span><span class="title">Messages</span></a></li>
                <li><a href="settings.html" data-nav="settings" class="active"><span class="icon"><ion-icon name="settings-outline"></ion-icon></span><span class="title">Settings</span></a></li>
                <li><a href="#" id="signOutBtn"><span class="icon"><ion-icon name="log-out-outline"></ion-icon></span><span class="title">Sign Out</span></a></li>
            </ul>
        </div>

        <div class="main">
            <div class="topbar">
                <div class="toggle"><ion-icon name="menu-outline"></ion-icon></div>
                <div class="rider-topbar-meta"><strong>Rider Settings</strong><span>Profile and work schedule</span></div>
                <div class="user" id="riderAvatar"></div>
            </div>

            <div class="details">
                <div class="settings-card">
                    <h2 style="margin-bottom:16px;">Profile</h2>
                    <form id="settings-form" class="settings-grid">
                        <div><label for="settings-name">Full Name</label><input id="settings-name" type="text" required></div>
                        <div><label for="settings-email">Email</label><input id="settings-email" type="email" readonly></div>
                        <div><label for="settings-number">Phone</label><input id="settings-number" type="tel"></div>
                        <div><label for="settings-address">Address</label><input id="settings-address" type="text"></div>
                        <div><label for="settings-vehicle-type">Vehicle Type</label>
                            <select id="settings-vehicle-type">
                                <option value="bicycle">Bicycle</option>
                                <option value="motorcycle">Motorcycle</option>
                                <option value="car">Car</option>
                            </select>
                        </div>
                        <div><label for="settings-vehicle-number">Vehicle Number</label><input id="settings-vehicle-number" type="text"></div>
                        <div><label for="settings-start">Work Start</label><input id="settings-start" type="time"></div>
                        <div><label for="settings-end">Work End</label><input id="settings-end" type="time"></div>
                        <button type="submit" class="primary-btn" style="width:max-content;">Save Changes</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/rider-shared.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/settings.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>
</html>
